services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # --pool=solo avoids forking extra worker processes, which matters on a
    # 1GB free-tier VM — the default prefork pool would spawn one child per
    # core and burn RAM for no real gain given how few tasks run per day.
    command: celery -A celery_app worker --loglevel=info --pool=solo

  beat:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: celery -A celery_app beat --loglevel=info
